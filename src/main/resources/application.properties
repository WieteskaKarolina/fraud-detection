mastercard.consumer.key=${MASTERCARD_CONSUMER_KEY}
mastercard.private.key.path=${MASTERCARD_PRIVATE_KEY_PATH}
mastercard.private.key.alias=${MASTERCARD_PRIVATE_KEY_ALIAS:KeyAlias}
mastercard.private.key.password=${MASTERCARD_PRIVATE_KEY_PASSWORD}

quarkus.rest-client.bin-lookup.url=${MASTERCARD_API_URL:https://sandbox.api.mastercard.com}

quarkus.hibernate-orm.database.generation=update
quarkus.cache.caffeine."binsCache".expire-after-write=10m
quarkus.cache.caffeine."binsCache".maximum-size=10000

mp.jwt.verify.issuer=${JWT_ISSUER:https://localhost}
smallrye.jwt.sign.key.location=${JWT_SIGN_KEY_LOCATION}
mp.jwt.verify.publickey.location=src/main/resources/META-INF/resources/publicKey.pem
smallrye.jwt.sign.algorithm=RS256

quarkus.datasource.username=${DATABASE_USERNAME}
quarkus.datasource.password=${DATABASE_PASSWORD}
quarkus.datasource.jdbc.url=${DATABASE_JDBC_URL}

quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
mp.openapi.extensions.smallrye.operationIdStrategy=method
quarkus.smallrye-openapi.path=/openapi

quarkus.log.category."com.example".level=INFO
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) [requestId=%X{requestId}, correlationId=%X{correlationId}] %s%e%n
